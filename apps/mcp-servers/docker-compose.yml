services:
  brave-search-mcp:
    image: ghcr.io/onprem-ai/mcp-key-proxy:latest
    security_opt:
      - seccomp=unconfined
    command:
      - '--stdio'
      - 'npx -y @brave/brave-search-mcp-server'
      - '--header-to-env'
      - 'x-api-key=BRAVE_API_KEY'
      - '--port'
      - '8000'
      - '--host'
      - '0.0.0.0'
      - '--pool-size'
      - '${MCP_PROXY_POOL_SIZE:-5}'
      - '--ttl'
      - '300'
      - '--cors'
      - '*'
    ports:
      - '${MCP_BRAVE_SEARCH_PORT:-4109}:8000'

  wikipedia-mcp:
    build:
      context: ./mcps/wikipedia-mcp
    security_opt:
      - seccomp=unconfined
    ports:
      - '${MCP_WIKIPEDIA_PORT:-4110}:8080'
