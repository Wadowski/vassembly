x-mcp-key-proxy: &mcp-key-proxy
  image: ghcr.io/onprem-ai/mcp-key-proxy:latest
  security_opt:
    - seccomp=unconfined

x-mcpproxy-go: &mcpproxy-go
  security_opt:
    - seccomp=unconfined

services:
  github-mcp:
    <<: *mcp-key-proxy
    command:
      - '--stdio'
      - 'npx -y @modelcontextprotocol/server-github'
      - '--header-to-env'
      - 'X-Mcp-Env-GITHUB_PERSONAL_ACCESS_TOKEN=GITHUB_PERSONAL_ACCESS_TOKEN'
      - '--port'
      - '8000'
      - '--host'
      - '0.0.0.0'
      - '--pool-size'
      - '${MCP_PROXY_POOL_SIZE:-5}'
      - '--ttl'
      - '300'
      - '--cors'
      - '*'
    ports:
      - '${MCP_GITHUB_PORT:-4101}:8000'

  context7:
    image: context7/mcp-server:latest
    ports:
      - '${MCP_CONTEXT7_PORT:-4001}:4001'

