name: E2E Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e-web:
    name: Web E2E
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        env:
          MONGO_INITDB_ROOT_USERNAME: user
          MONGO_INITDB_ROOT_PASSWORD: pass
        options: >-
          --health-cmd "mongosh --authenticationDatabase admin -u user -p pass --eval db.adminCommand('ping')"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E Web Tests
        run: pnpm test:e2e:web
        env:
          MONGODB_URL: mongodb://user:pass@localhost:27017
          MONGODB_DATABASE: vassembly_e2e_web
          JWT_SECRET: dev-jwt-secret
          E2E_WEB_BASE_URL: http://localhost:3000
          E2E_API_BASE_URL: http://localhost:5000
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-web
          path: apps/web/playwright-report/
