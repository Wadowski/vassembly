name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Types & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm test

  e2e-web:
    name: Web E2E (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      MONGODB_DATABASE: vassembly_e2e_web
      MONGODB_URL: mongodb://user:pass@localhost:27017/?directConnection=true
      JWT_SECRET: dev-jwt-secret
      WEB_PORT: 3001
      API_PORT: 5001
      E2E_WEB_BASE_URL: http://localhost:3001
      E2E_API_BASE_URL: http://localhost:5001
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5001
      NODE_ENV: e2e
      VASSEMBLY_E2E: true
      E2E_ENABLE_DIAGNOSTICS: false
      CI: true
    services:
      mongodb:
        image: mongo:7.0
        env:
          MONGO_INITDB_ROOT_USERNAME: user
          MONGO_INITDB_ROOT_PASSWORD: pass
        options: >-
          --health-cmd "mongosh --quiet mongodb://user:pass@127.0.0.1:27017/admin --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 30s
          --health-retries 10
          --health-start-period 40s
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - run: pnpm install
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @vassembly/web exec playwright install --with-deps chromium
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @vassembly/web exec playwright install-deps chromium
      - name: Start E2E servers
        run: |
          pnpm dev:e2e:ci > servers.log 2>&1 &
          echo $! > servers.pid

          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:5001/docs > /dev/null && curl -sf http://localhost:3001 > /dev/null; then
              echo "E2E servers are ready"
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "E2E servers failed to start"
              cat servers.log
              exit 1
            fi
            sleep 2
          done
      - name: Run E2E Web Tests
        run: pnpm test:e2e:web:ci -- --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-web-shard-${{ matrix.shard }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            servers.log
