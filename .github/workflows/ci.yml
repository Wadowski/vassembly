name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Types & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm test

  e2e-web:
    name: Web E2E
    runs-on: ubuntu-latest
    env:
      MONGODB_DATABASE: vassembly_e2e_web
      CI: true
    services:
      mongodb:
        image: mongo:7.0
        env:
          MONGO_INITDB_ROOT_USERNAME: user
          MONGO_INITDB_ROOT_PASSWORD: pass
        options: >-
          --health-cmd "mongosh --quiet mongodb://user:pass@127.0.0.1:27017/admin --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 30s
          --health-retries 10
          --health-start-period 40s
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @vassembly/web exec playwright install --with-deps chromium
      - name: Start E2E servers
        run: |
          pnpm dev:e2e:ci > servers.log 2>&1 &
          echo $! > servers.pid

          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:5001/docs > /dev/null && curl -sf http://localhost:3001 > /dev/null; then
              echo "E2E servers are ready"
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "E2E servers failed to start"
              cat servers.log
              exit 1
            fi
            sleep 2
          done
      - name: Run E2E Web Tests
        run: pnpm test:e2e:web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-web
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            servers.log
